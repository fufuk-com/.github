<svg xmlns="http://www.w3.org/2000/svg" width="880" height="180" viewBox="0 0 880 180" role="img" aria-label="A-Fu Design Studio">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="accent-line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="35%" stop-color="#3b82f6" />
      <stop offset="70%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <radialGradient id="glow-left" cx="15%" cy="20%" r="45%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glow-right" cx="85%" cy="80%" r="45%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.24" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0" />
    </radialGradient>
    <clipPath id="rounded-clip">
      <rect x="0" y="0" width="880" height="180" rx="16" ry="16" />
    </clipPath>
  </defs>

  <g clip-path="url(#rounded-clip)">
    <rect width="880" height="180" fill="url(#bg-grad)" />
    <rect width="880" height="180" fill="url(#glow-left)" />
    <rect width="880" height="180" fill="url(#glow-right)" />

    <!-- Subtle geometric grid -->
    <g stroke="#94a3b8" stroke-opacity="0.07" stroke-width="1">
      <line x1="0" y1="45" x2="880" y2="45" />
      <line x1="0" y1="90" x2="880" y2="90" />
      <line x1="0" y1="135" x2="880" y2="135" />
      <line x1="110" y1="0" x2="110" y2="180" />
      <line x1="220" y1="0" x2="220" y2="180" />
      <line x1="330" y1="0" x2="330" y2="180" />
      <line x1="440" y1="0" x2="440" y2="180" />
      <line x1="550" y1="0" x2="550" y2="180" />
      <line x1="660" y1="0" x2="660" y2="180" />
      <line x1="770" y1="0" x2="770" y2="180" />
    </g>

    <!-- Decorative tech nodes -->
    <circle cx="80" cy="45" r="2.5" fill="#00f2fe" fill-opacity="0.45" />
    <circle cx="800" cy="135" r="2.5" fill="#10b981" fill-opacity="0.45" />
    <circle cx="770" cy="45" r="2" fill="#8b5cf6" fill-opacity="0.45" />

    <!-- Bottom accent bar -->
    <rect x="0" y="176" width="880" height="4" fill="url(#accent-line)" />

    <!-- Brand badge + Title -->
    <g transform="translate(262, 46)">
      <rect x="0" y="4" width="38" height="38" rx="10" fill="#06b6d4" fill-opacity="0.18" stroke="#00f2fe" stroke-opacity="0.5" stroke-width="1.2" />
      <path d="M21 11L13 24h6l-1.5 11L27 21h-6.2L21 11z" fill="#00f2fe" />
      <text x="52" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#f8fafc" letter-spacing="0.5">A-Fu Design Studio</text>
    </g>

    <!-- Subtitle -->
    <text x="440" y="122" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#cbd5e1" letter-spacing="0.8">全方位數位產品開發 · 雲端軟體專家 · 瀏覽器擴充功能與生態系實驗室</text>
  </g>

  <rect x="0.75" y="0.75" width="878.5" height="178.5" rx="15.5" ry="15.5" fill="none" stroke="#334155" stroke-width="1.5" />
</svg>
